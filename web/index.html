<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartDisplay · 家的時光</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#0c141b;color:#f4f4f0;font-family:system-ui,sans-serif;overflow:hidden;cursor:none}#photo{position:fixed;width:100vw;height:100vh;object-fit:contain}#veil{position:fixed;inset:0;background:linear-gradient(90deg,#081018d9,transparent 85%)}main{position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100vh;padding:6vh 5vw;width:54vw}#clock{font-size:clamp(64px,9vw,140px);font-weight:200;letter-spacing:-.06em;line-height:1}#date{font-size:24px;margin-top:16px;color:#c6d3d9}h1{font-size:16px;font-weight:500;letter-spacing:.25em;color:#a9c2ce}#events{list-style:none;padding:0}li{border-left:2px solid #a4c6b6;padding:8px 18px;margin:16px 0;font-size:24px}small{display:block;font-size:15px;color:#aebfc6;margin-bottom:6px}#message{font-size:23px}#status{font-size:12px;color:#9cabb5}body.photos main,body.photos #veil{display:none}body.calendar #photo{display:none}body.calendar main{width:90vw}body.blank>*{display:none}body.blank{background:#000}#empty{position:fixed;right:8vw;top:48vh;color:#819aa8}body.photos #empty{display:block}@media(orientation:portrait){main{width:100vw;padding:4vh 7vw}#clock{font-size:20vw}#veil{background:linear-gradient(0deg,#081018ed,transparent)}#empty{top:40vh}}
</style>
<img id="photo" alt="家庭照片"><div id="empty">匯入照片，留住家的時光</div><div id="veil"></div>
<main><header><h1>家的時光 · SMART DISPLAY</h1><div id="clock"></div><div id="date"></div></header><section><ul id="events"></ul><p id="message"></p><div id="status"></div></section></main>
<script>
let state={photos:[],events:[],interval:20,timezone:'Asia/Taipei'},index=-1,lastPhoto=0,lastList='',lastEvents='';
const el=id=>document.getElementById(id);
function clock(){const now=new Date();el('clock').textContent=now.toLocaleTimeString('zh-TW',{timeZone:state.timezone,hour:'2-digit',minute:'2-digit',hour12:false});el('date').textContent=now.toLocaleDateString('zh-TW',{timeZone:state.timezone,year:'numeric',month:'long',day:'numeric',weekday:'long'});}
function advance(){const photos=state.photos||[];el('empty').hidden=!!photos.length;el('photo').hidden=!photos.length;if(!photos.length)return;index=(index+1)%photos.length;el('photo').src=photos[index];lastPhoto=Date.now();}
function renderEvents(){const now=new Date();const today=now.toLocaleDateString('en-CA',{timeZone:state.timezone});const events=(state.events||[]).filter(e=>e.end.date?e.end.date>today:new Date(e.end.dateTime)>now).slice(0,5);const key=JSON.stringify(events)+state.timezone;if(key===lastEvents)return;lastEvents=key;el('events').replaceChildren();for(const e of events){const li=document.createElement('li'),time=document.createElement('small'),title=document.createElement('span');time.textContent=e.start.date?e.start.date+' · 全天':new Date(e.start.dateTime).toLocaleString('zh-TW',{timeZone:state.timezone,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});title.textContent=e.title;li.append(time,title);el('events').append(li);}}
async function refresh(){try{const response=await fetch('state.json',{cache:'no-store'});if(!response.ok)throw new Error('state');state=await response.json();document.body.className=state.mode;el('message').textContent=state.message;el('photo').style.objectFit=state.fit;const list=JSON.stringify(state.photos);if(list!==lastList){lastList=list;index=-1;advance();}clock();renderEvents();el('status').textContent=state.calendar_updated_at?'日曆更新：'+new Date(state.calendar_updated_at).toLocaleString('zh-TW',{timeZone:state.timezone})+' · 超過 30 分鐘請檢查 Mac 同步':'日曆尚未同步';}catch(e){el('status').textContent='讀取更新失敗，保留目前畫面';}}
el('photo').addEventListener('error',()=>{el('empty').hidden=false;el('empty').textContent='照片暫時無法載入，稍後切換';});
refresh();setInterval(refresh,10000);setInterval(()=>{clock();renderEvents();if(Date.now()-lastPhoto>=Math.max(5,state.interval||20)*1000)advance();},1000);
</script></html>
